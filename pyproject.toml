[project]
name = "clip-scout"
version = "0.1.0"
description = "Finds, edits and publishes the best moments from Elgato streams."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
    "yt-dlp",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy",
]

[project.optional-dependencies]
music = ["torch>=2.6", "transformers>=4.46"]
publish = ["google-api-python-client", "google-auth-oauthlib", "tzdata"]

[project.scripts]
scout = "clipscout.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipscout"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
